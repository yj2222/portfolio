<style>
:root{--main:#e91e63;--text:#222;--sub:#666;--line:#e5e5e5;--soft:#fdf2f6;}
*{box-sizing:border-box}
body{margin:0;font-family:"Noto Sans JP",sans-serif;line-height:1.8;color:var(--text);background:#fff}
main{max-width:860px;margin:0 auto;padding:40px 16px 80px}
h1{font-size:28px;margin:0 0 8px;padding-bottom:12px;border-bottom:3px solid var(--main)}
.lead{color:var(--sub);font-size:14px;margin:0 0 24px}
h2{font-size:18px;margin:40px 0 12px;padding:4px 12px;border-left:5px solid var(--main);background:var(--soft)}
ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
li a{display:block;height:100%;padding:14px 16px;border:1px solid var(--line);border-radius:8px;text-decoration:none;color:var(--text);transition:border-color .15s,box-shadow .15s}
li a:hover{border-color:var(--main);box-shadow:0 2px 8px rgba(233,30,99,.12)}
.t{display:block;font-weight:700;font-size:16px}
.note{display:block;font-size:12px;color:var(--sub);margin-top:4px}
</style>
</head>
